<script>(function(root){
'use strict';
const enc=new TextEncoder(),dec=new TextDecoder();
const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function base64(value){let s='';for(const b of new Uint8Array(value))s+=String.fromCharCode(b);return btoa(s)}
async function keyFor(password,salt,iterations,usage){
 const material=await root.crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
 return root.crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,[usage]);
}
async function seal(text,password){
 const salt=root.crypto.getRandomValues(new Uint8Array(16)),iv=root.crypto.getRandomValues(new Uint8Array(12)),iterations=600000;
 const key=await keyFor(password,salt,iterations,'encrypt');
 const ciphertext=await root.crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(text));
 return {version:1,iterations,salt:base64(salt),iv:base64(iv),ciphertext:base64(ciphertext)};
}
async function open(payload,password){
 if(payload?.version!==1||payload.iterations!==600000)throw new Error('Unsupported encrypted page.');
 const salt=bytes(payload.salt),iv=bytes(payload.iv);
 if(salt.length!==16||iv.length!==12)throw new Error('Invalid encrypted page.');
 const key=await keyFor(password,salt,payload.iterations,'decrypt');
 return dec.decode(await root.crypto.subtle.decrypt({name:'AES-GCM',iv},key,bytes(payload.ciphertext)));

<script>
document.getElementById('unlock').addEventListener('submit',async event=>{
 event.preventDefault();
 const field=document.getElementById('password'),button=event.currentTarget.querySelector('button'),status=document.getElementById('status');
 if(!globalThis.crypto?.subtle){status.textContent='Open this page using HTTPS in Safari or Chrome.';return}
 button.disabled=true;status.textContent='Opening…';
 try{
  const page=await PrivatePage.open(JSON.parse(document.getElementById('encrypted-page').textContent),field.value.trim());
  field.value='';document.open();document.write(page);document.close();
 }catch{status.textContent='Could not open. Check your password and try again.';button.disabled=false;field.focus()}
});
